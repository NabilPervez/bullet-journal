<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Core -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF7" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Marginalia — a digital bullet journal with rapid logging, an Index, Future Log, Monthly Log, and a daily time-blocking agenda." />
    <title>Marginalia — Bullet Journal & Time Blocker</title>

    <!-- Icons / favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS home-screen behavior (Safari does not fully read the web manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Marginalia" />

    <!-- Android/Chrome PWA behavior -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Link previews (iMessage, Slack, social) -->
    <meta property="og:title" content="Marginalia — Bullet Journal & Time Blocker" />
    <meta property="og:description" content="Rapid logging, an Index, Future Log, Monthly Log, and a daily time-blocking agenda." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
