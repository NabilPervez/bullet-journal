<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Core -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="A digital bullet journal: rapid logging, an index, a future log, a monthly log, and a daily time-blocking agenda." />
    <title>Digital Bullet Journal</title>

    <!-- Icons / favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS home-screen behavior (Safari does not fully read the web manifest) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bullet Journal" />

    <!-- Android/Chrome PWA behavior -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Link previews (iMessage, Slack, social) -->
    <meta property="og:title" content="Digital Bullet Journal" />
    <meta property="og:description" content="Rapid logging, an Index, Future Log, Monthly Log, and a daily time-blocking agenda." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts: linked here rather than @import-ed from CSS, which blocked first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
